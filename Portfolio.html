<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        

        .page {
            display: grid;
            grid-template-rows: 70px 1fr;
            min-height: 100vh;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--light);
            color: var(--text);
        }


        /*
           NAVBAR - FLEXBOX
        */

        nav {
            height: 70px;
            background-color: var(--dark);

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 7%;
            background-color: #111872;
        }

        nav h2 {
            color: white;
            text-shadow: 2px 2px 5px black;
        }

        .links {
            display: flex;
            gap: 25px;
        }

        .links a {
            color: white;
            text-decoration: none;
            cursor: pointer;

            transition: 0.3s;
        }

        .links a:hover {
            color: #60a5fa;
        }


        .hero {
            min-height: 500px;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            background: linear-gradient(
                135deg,
                #dbeafe,
                #eff6ff
            );

            padding: 50px 20px;
        }

        .hero-content {
            animation: fadeIn 1.5s ease;
        }

        .hero h1 {
            font-size: 50px;
            color: var(--dark);

            text-shadow: 3px 3px 8px #aaa;
        }

        .hero p {
            margin: 15px 0 25px;
            font-size: 18px;
        }

        .btn {
            display: inline-block;

            padding: 12px 25px;

            background-color: var(--primary);
            color: white;

            text-decoration: none;

            border-radius: 8px;

            cursor: pointer;

            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-5px);

            box-shadow: 0 8px 15px #999;
        }


                main {
            padding: 40px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            padding: 30px;
            background-color: #f1f5f9;
            text-align: center;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        
    </style>
</head>
<body>
    <!--navbar-->

    <nav>
        <h2> My Portfolio </h2>
        <div class="links">
            <a href="#home">Home</a>
            <a href="#Projects">Projects</a>
            <a href="#about">About</a>
        </div>
    </nav>

    <!--Home Section-->

    <section class="hero" id="home">

        <div class="hero-content">

            <h1>Hello, I'm Ramsha 👋</h1>

            <p>
                Front-End Developer | Web Development Learner
            </p>

            <a href="#projects" class="btn">
                View My Projects
            </a>

        </div>
<!-- 
        Card Section
         -->

        <main>

            <div class="card">
                <h2>Card 1</h2>

                <div class="buttons">
                    <button>View</button>
                    <button>Buy</button>
                </div>
            </div>

            <div class="card">
                <h2>Card 2</h2>

                <div class="buttons">
                    <button>View</button>
                    <button>Buy</button>
                </div>
            </div>

            <div class="card">
                <h2>Card 3</h2>

                <div class="buttons">
                    <button>View</button>
                    <button>Buy</button>
                </div>
            </div>

        </main>

    </div>

    </section>
</body>
</html>
