<!DOCTYPE html>
<html>
    <head>
        <title> box Mode;(hover border)</title>
        <style>
            .main{
                display: flex;
            }
            .box1{
                height: 200px;
                width: 200px;
                color:black;
                font-size: 20px;
                background-color:yellow;
                border:5px solid black ;
                margin:50px ;
                padding:10px;
                 }
                 .box2{
                height: 200px;
                width: 200px;
                color:black;
                font-size: 20px;
                background-color:brown;
                border:5px solid black ;
                margin:50px ;
                padding:10px;
                 }
                 .box3{
                height: 200px;
                width: 200px;
                color:black;
                font-size: 20px;
                background-color:mediumpurple;
                border:5px solid black ;
                margin:50px ;
                padding:10px;
                 }
            .box1:hover{
                color: aliceblue;
                background-color: darkblue;
            }
            .box2:hover{
                color: lightcoral;
                background-color: dimgrey   ;
            }
            .box3:hover{
                color:hotpink;
                background-color: lightyellow;}
        </style>
    </head>
    <body>
        <div class="main">
            <div class="box1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Ea, obcaecati!</div>
            <div class="box2">Lorem ipsum dolor sit amet consectetur adipisicing elit. Ea, obcaecati!</div>
            <div class="box3">Lorem ipsum dolor sit amet consectetur adipisicing elit. Ea, obcaecati!</div>
        </div>
    </body>
</html>
