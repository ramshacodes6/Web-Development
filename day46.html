<!DOCTYPE html>
<html>
<head>
    <title>CSS Positioning</title>

    <style>

        .box {
            width: 150px;
            height: 100px;
            background-color: lightblue;
            margin: 20px;
            padding: 20px;
            border-radius: 20px;
        }

        /* Relative */
        .relative-box {
            position: relative;
            left: 50px;
            top: 20px;
            background-color: lightgreen;
        }

        /* Parent */
        .parent {
            width: 400px;
            height: 250px;
            background-color: lightgray;
            position: relative;
            margin: 50px;
        }

        /* Absolute */
        .absolute-box {
            width: 100px;
            height: 80px;
            background-color: orange;

            position: absolute;
            right: 20px;
            bottom: 20px;
        }

    </style>
</head>

<body>

    <h1>CSS Positioning</h1>

    <div class="box">
        Normal Box
    </div>

    <div class="box relative-box">
        Relative Box
    </div>

    <div class="parent">

        <h2>Parent Box</h2>

        <div class="absolute-box">
            Absolute
        </div>

    </div>

</body>
</html>
