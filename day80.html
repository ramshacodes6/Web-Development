<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional statement</title>
</head>
<body>
    
    <script>

        //even or oddd
            let number = 7;

            if (number % 2 === 0) {
             console.log("Even Number");
            } else {
             console.log("Odd Number");
            }


            //logical operatotrs with condition 

            let username = "Ramsha";
            let password = "12345";

            if (username === "Ramsha" && password === "12345") {
                 console.log("Login Successful");
            } else {
                console.log("Invalid Details");
        }



        let day = 3;

        switch (day) {
            case 1:
                console.log("Monday");
                break;

            case 2:
                console.log("Tuesday");
                break;

            case 3:
                console.log("Wednesday");
                break;

            case 4:
                console.log("Thursday");
                break;

            case 5:
                console.log("Friday");
                break;

            default:
                console.log("Invalid Day");
        }
    </script>
</body>
</html>
