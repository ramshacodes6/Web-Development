<body>
    <script>

        //for loop -  print even number
        for (let i = 2; i <= 20; i += 2) {
    console.log(i);
}


// while loop - print 1 to 5

let i = 1;

while (i <= 5) {
    console.log(i);
    i++;
}


//while loop - countdown

let count = 5;

while (count >= 1) {
    console.log(count);
    count--;
}

console.log("Done!");
    </script>
