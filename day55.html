<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Radial Gradient</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background-color: #f1f5f9;
        }

        .circle {

            width: 300px;

            height: 300px;

            border-radius: 50%;

            background: radial-gradient(
                white,
                blue,
                purple
            );

            display: flex;

            justify-content: center;

            align-items: center;

            color: white;

            font-size: 24px;

        }

    </style>

</head>

<body>

    <div class="circle">
        Radial Gradient
    </div>
    

</body>

</html>
