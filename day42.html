<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

     <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        .dashboard{

            min-height: 100vh;

            display: grid;

            grid-template-columns: 220px 1fr;

            grid-template-rows: 70px 1fr 60px;

            gap: 10px;

            grid-template-areas:

                "sidebar header"

                "sidebar content"

                "sidebar footer";
        }

        .header{
            grid-area: header;

            background: #2563eb;
            color: white;

            display: flex;
            align-items: center;

            padding: 20px;

            font-size: 22px;
        }

        .sidebar{
            grid-area: sidebar;

            background: #1e293b;
            color: white;

            padding: 25px;
        }

        .sidebar h2{
            margin-bottom: 25px;
        }

        .sidebar p{
            margin-bottom: 15px;
        }

        .content{
            grid-area: content;

            padding: 25px;

            background: white;
        }

        .cards{

            display: grid;

            grid-template-columns:
                1fr 1fr 1fr;

            gap: 20px;

            margin-top: 20px;
        }

        .card{

            padding: 30px;

            background: #dbeafe;

            border-radius: 10px;

            text-align: center;

            font-size: 20px;
        }

        .footer{
            grid-area: footer;

            background: #cbd5e1;

            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>

</head>

<body>

    <div class="dashboard">

        <header class="header">
            My Dashboard
        </header>


        <aside class="sidebar">

            <h2>Menu</h2>

            <p>Home</p>
            <p>Profile</p>
            <p>Projects</p>
            <p>Settings</p>

        </aside>


        <main class="content">

            <h1>Welcome!</h1>

            <div class="cards">

                <div class="card">
                    HTML
                </div>

                <div class="card">
                    CSS
                </div>

                <div class="card">
                    GitHub
                </div>

            </div>

        </main>


        <footer class="footer">
            My Web Development Journey
        </footer>

    </div>

</body>

</html>
