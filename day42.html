<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

   

</head>

<body>

    <div class="dashboard">

        <header class="header">
            My Dashboard
        </header>


        <aside class="sidebar">

            <h2>Menu</h2>

            <p>Home</p>
            <p>Profile</p>
            <p>Projects</p>
            <p>Settings</p>

        </aside>


        <main class="content">

            <h1>Welcome!</h1>

            <div class="cards">

                <div class="card">
                    HTML
                </div>

                <div class="card">
                    CSS
                </div>

                <div class="card">
                    GitHub
                </div>

            </div>

        </main>


        <footer class="footer">
            My Web Development Journey
        </footer>

    </div>

</html>
