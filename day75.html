<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Buttons Styling</title>
    <style>
        *{
            /* background-color: black; */
        }

            .btn {
            background: linear-gradient(135deg,
             #667eea, #764ba2, #f093fb);
            background-size: 200%;
             transition: background-position 0.5s;
             font-size: 50px;
             border-radius: 30px;
             padding: 20px;
             margin : 20px;
        }
        .btn:hover {
            background-position: 100%;
        }

        .btn2 {
            background: linear-gradient(-45deg,
            #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: aurora 8s ease infinite;
            font-size: 50px;
             border-radius: 30px;
             padding: 20px;
             margin : 20px;
        }
            @keyframes aurora {
            0%,100% { background-position: 0% 50%; }
            50%     { background-position: 100% 50%; }
        }


        .btn3 { 
            position: relative;
            overflow: hidden; 
            font-size: 50px;
             border-radius: 30px;
             padding: 20px;
             margin : 20px;
            }
        .btn3::before {
        content: '';
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 100%;
        background: linear-gradient(90deg, #7c6aff, #ff6ab0);
        transition: left 0.4s cubic-bezier(0.77,0,0.175,1);
        }
        .btn3:hover::before { left: 0; }

        
.btn4 {
    font-size: 50px;
    border-radius: 30px;
    padding: 20px;
    margin : 20px;
  position: relative;         
  /* overflow: hidden;            */
  background: #6366f1;         
  color: #ffffff;
  font-size: 16px;
  font-weight: 600;
  padding: 12px 28px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  outline: none;
  transition: background 0.3s ease;
}


.btn4::after {
  content: '';
  position: absolute;
  top: 0;
  left: -75%;
  width: 50%;
  height: 100%;
  background: linear-gradient(
    to right,
    transparent,
    rgba(255, 255, 255, 0.35), 
    transparent
  );
  transform: skewX(-20deg);
}


.btn4:hover::after {
  animation: sweep 0.6s ease-in-out forwards;
}


    @keyframes sweep {
        0% {
        left: -75%;
        }
        100% {
            left: 125%;
        }
    }
    </style>
</head>
<body>
    <button class = "btn">Click Me</button>
    <button class ="btn2">Hello</button>

    <button class ="btn3">Side Fill</button>

    <button class="btn4">Shimmer</button>

    
    
</body>
</html>
