<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 100%;
            height: 150px;
            background-color: rgb(255, 185, 185);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            width: 100px;
            height: 100px;
            background-color: rgb(217, 159, 246);
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            margin: 50px;
        }
        .container:hover{
            background-color: rgb(13, 126, 121);
            transition: ease-in-out;
            transition-duration: 0.5s;
            transform: scale(1.2);
        }
        #two:hover{
            background-color: rgb(67, 195, 189);
            transition: ease-in-out;
            transition-duration: 1s;
            transform:  rotate(45deg);
        }
        #three:hover{
            background-color: rgb(255, 185, 185);
            transition: ease-in-out;
            transition-duration: 1s;
            transform:  translateX(50px);
        }
        #four:hover{
            background-color: rgb(13, 126, 121);
            transition: ease-in-out;
            transition-duration: 1s;
            transform:  translateY(50px);
        }
    </style>
</head>
<body>
<div class="main"> 
    <div class="container" id="one"> 1</div>
    <div class="container" id="two"> 2</div>
    <div class="container" id="three"> 3</div>
    <div class="container" id="four"> 4</div>
</div> 
</body>
</html>
