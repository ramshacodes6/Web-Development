<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            width:300px;
            height:200px;
            background-color:#2563eb;
            color:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
        }

        button{
            background-color:white;
            color:#2563eb;
            padding:12px 25px;
            border:none;
            border-radius:5px;
        }

        button:hover{
            background-color:#1d4ed8;
            color:white;
        }
        </style>
</head>
<body>
    <div class="card">
    <h2>Frontend Developer</h2>
    <button>Hire Me</button>
</div>
</body>
</html>
