<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scope in Javascript</title>
</head>
<body>
    
</body>

<script>

    //global scope
    let name = "Ramsha";

function greet() {
    console.log(name);
}

greet();

console.log(name);


//function scope

function greet() {

    let message = "Hello World";

    console.log(message);
}

greet();

console.log(message);


//block scope

if (true) {

    let age = 22;
    const city = "Delhi";

    console.log(age);
    console.log(city);
}

console.log(age);
</script>
</html>
