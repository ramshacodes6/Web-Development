<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hover Practice</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: space-evenly;
            align-items: center;
            gap : 100px;
            /* margin :50px; */
            background-color: #f1f5f9;
        }

        button{

            background-color: #2563eb;
            color: white;

            border: none;

            padding: 15px 30px;

            font-size: 20px;

            border-radius: 10px;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover{

            background-color: #1d4ed8;

            transform: scale(1.1);
        }

        .form{

            width: 350px;

            background-color: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2{
            text-align: center;
            margin-bottom: 20px;
        }

        input{

            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border: 2px solid #cbd5e1;

            border-radius: 8px;

            outline: none;

            font-size: 16px;
        }


        input:focus{

            border-color: #2563eb;

            box-shadow: 0 0 8px rgba(37,99,235,0.4);
        }

    </style>

</head>

<body>

    <button>
        Hover Me
    </button>



    <div class="form">

        <h2>Login Form</h2>

        <input type="text" placeholder="Enter your name">

        <input type="email" placeholder="Enter your email">

        <input type="password" placeholder="Enter password">

    </div>
</body>

</html>
