<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hover Practice</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #f1f5f9;
        }

        button{

            background-color: #2563eb;
            color: white;

            border: none;

            padding: 15px 30px;

            font-size: 20px;

            border-radius: 10px;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover{

            background-color: #1d4ed8;

            transform: scale(1.1);
        }

    </style>

</head>

<body>

    <button>
        Hover Me
    </button>

</body>

</html>
