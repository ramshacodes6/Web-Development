<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Z-Index Practice</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
            padding: 50px;
        }

        h1{
            margin-bottom: 40px;
        }

        .container{
            position: relative;

            width: 500px;
            height: 300px;

            border: 3px solid black;
        }

        .box{
            width: 180px;
            height: 180px;

            position: absolute;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 20px;
        }

        .box1{
            background-color: blue;

            top: 30px;
            left: 30px;

            z-index: 1;
        }

        .box2{
            background-color: red;

            top: 80px;
            left: 100px;

            z-index: 2;
        }

        .box3{
            background-color: green;

            top: 120px;
            left: 180px;

            z-index: 3;
        }

    </style>
</head>

<body>

    <h1>CSS Z-Index</h1>

    <div class="container">

        <div class="box box1">
            Box 1
        </div>

        <div class="box box2">
            Box 2
        </div>

        <div class="box box3">
            Box 3
        </div>

    </div>

</body>

</html>
