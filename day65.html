<!DOCTYPE html>
<html>
<head>
    <title>Box Shadow</title>

    <style>
        .card {
            width: 250px;
            padding: 30px;
            margin: 50px;
            background-color: white;

            box-shadow: 5px 5px 10px gray;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>My Card</h2>
        <p>This card has a shadow.</p>
    </div>

</body>
</html>
