<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 14 practice</title>
</head>
<body>
    

    <form>
        <fieldset>
            <legend>Login Form</legend>
            
           
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" name="email" required>
            
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" name="password" required>
           
                <label>
                    <input type="checkbox" name="remember_me"> Remember Me
                </label>
             <br><br>
                <button type="submit">Login</button>
                <button type="reset">Reset</button>
             <br><br>
        </fieldset>
    </form>
    <br><br>



    <form>
        <fieldset>
            <legend>Registration Form</legend>
            
            
                <label for="reg-name">Full Name:</label>
                <input type="text" id="reg-name" name="fullname" required>
            
                <label for="reg-email">Email:</label>
                <input type="email" id="reg-email" name="email" required>
                 <br><br>

            
                <label>Gender:</label><br>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
              
                
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
                 <br><br>
            
                <label for="city">Choose City:</label>
                <select id="city" name="user_city">
                    <option value="">-- Select --</option>
                    <option value="new-york">New York</option>
                    <option value="london">London</option>
                    <option value="other">Other</option>
                </select>
            
                 <br><br>
                <label for="about">About Yourself:</label><br>
                <textarea id="about" name="user_bio" rows="4" cols="30"></textarea>
             <br><br>
                <label>
                    <input type="checkbox" name="terms" required> I accept the terms and conditions.
                </label>
             <br><br>
                <button type="submit">Submit</button>
                <button type="reset">Reset Form</button>
            
        </fieldset>
    </form>



</body>
</html>
