<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Buttons Styling</title>

    <style>
        .btn {

            border-radius: 15%;
            font-size: 1.5rem;
            font-weight: 600;
            height: 70px;
            width: 150px;

            /* border:none */


            background: linear-gradient(135deg,
                #667eea, #764ba2, #f093fb);
            background-size: 200%;
            transition: background-position 0.5s;
        }

        .btn:hover {
        background-position: 100%;
}
    </style>

</head>
<body>
    <button class="btn">Hover me</button>
</body>
</html>
