<!DOCTYPE html>
<html>
<head>
    <title>Grid and Flexbox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .container {
            min-height: 100vh;

            display: grid;

            grid-template-rows: 80px 1fr 60px;

            grid-template-columns: 200px 1fr;
        }

        header {
            grid-column: 1 / 3;
            background-color: #1e3a8a;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        aside {
            background-color: #dbeafe;
            padding: 20px;
        }

        main {
            padding: 30px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            flex: 1;
            padding: 30px;
            background-color: #f1f5f9;
            text-align: center;
            box-shadow: 0 3px 10px gray;
        }

        footer {
            grid-column: 1 / 3;
            background-color: #172554;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>My Website</h1>
        </header>

        <aside>
            <h3>Sidebar</h3>
            <p>Home</p>
            <p>About</p>
            <p>Contact</p>
        </aside>

        <main>

            <h2>My Cards</h2>

            <div class="cards">

                <div class="card">
                    <h3>HTML</h3>
                    <p>Structure</p>
                </div>

                <div class="card">
                    <h3>CSS</h3>
                    <p>Design</p>
                </div>

                <div class="card">
                    <h3>JavaScript</h3>
                    <p>Logic</p>
                </div>

            </div>

        </main>

        <footer>
            <p>My Footer</p>
        </footer>

    </div>

</body>
</html>
