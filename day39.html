<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Practice</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: #f1f5f9;
            padding: 30px;
        }

        h1{
            text-align: center;
            margin-bottom: 40px;
            color: #1e293b;
        }

        h2{
            margin-bottom: 15px;
            color: #334155;
        }

        .section{
            margin-bottom: 50px;
        }

        .box{
            background: #2563eb;
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            font-size: 18px;
        }


        /* 
           Example 1
           2 Equal Columns
        */

        .grid1{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }


        /* 
           Example 2
           3 Equal Columns
         */

        .grid2{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }


        /* 
           Example 3
           Different Column Sizes
       */

        .grid3{
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
        }


        /* 
           Example 4
           Rows and Columns
        */

        .grid4{
            display: grid;

            grid-template-columns: 1fr 1fr;

            grid-template-rows:
                100px
                150px
                200px;

            column-gap: 20px;
            row-gap: 15px;
        }


        /* 
           Example 5
           Different Column Widths
       */

        .grid5{
            display: grid;

            grid-template-columns:
                150px
                1fr
                2fr;

            gap: 20px;
        }

    </style>
</head>

<body>

    <h1>CSS Grid Practice</h1>


    

    <div class="section">

        <h2>Example 1 - 2 Equal Columns</h2>

        <div class="grid1">

            <div class="box">Box 1</div>
            <div class="box">Box 2</div>
            <div class="box">Box 3</div>
            <div class="box">Box 4</div>

        </div>

    </div>


    

    <div class="section">

        <h2>Example 2 - 3 Equal Columns</h2>

        <div class="grid2">

            <div class="box">HTML</div>
            <div class="box">CSS</div>
            <div class="box">JavaScript</div>

            <div class="box">Git</div>
            <div class="box">GitHub</div>
            <div class="box">C++</div>

        </div>

    </div>


    <div class="section">

        <h2>Example 3 - 1fr 2fr 1fr</h2>

        <div class="grid3">

            <div class="box">1fr</div>
            <div class="box">2fr</div>
            <div class="box">1fr</div>

        </div>

    </div>


    

    <div class="section">

        <h2>Example 4 - Rows + Columns</h2>

        <div class="grid4">

            <div class="box">Box 1</div>
            <div class="box">Box 2</div>

            <div class="box">Box 3</div>
            <div class="box">Box 4</div>

            <div class="box">Box 5</div>
            <div class="box">Box 6</div>

        </div>

    </div>


   

    <div class="section">

        <h2>Example 5 - Different Column Sizes</h2>

        <div class="grid5">

            <div class="box">150px</div>
            <div class="box">1fr</div>
            <div class="box">2fr</div>

        </div>

    </div>

</body>
</html>
