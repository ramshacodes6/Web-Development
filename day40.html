<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grid Column Practice</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px;
        }

        h1{
            text-align: center;
            margin-bottom: 30px;
        }

        .container{
            display: grid;

            grid-template-columns: 1fr 1fr 1fr;

            gap: 15px;
        }

        .box{
            background: #ffa970;
            color: rgb(0, 0, 0);

            padding: 30px;

            text-align: center;

            border-radius: 10px;

            font-size: 20px;
        }

        .box1{
                    /* grid-column: span 2; */
                    /* grid-column: span 3; */
                    grid-column: 1 / 3;
        }

    </style>
</head>

<body>

    <h1>Grid Column Practice</h1>

    <div class="container">

        <div class="box box1">Box 1</div>

        <div class="box">Box 2</div>

        <div class="box">Box 3</div>

        <div class="box">Box 4</div>

        <div class="box">Box 5</div>

    </div>

</body>
</html>
