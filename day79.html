    <script>

          // while loop to count 1 to 10
    var i = 1;
    while(i <= 10){
        console.log(i);
        i++;
    }

 // create the table of 7
    var numbr = 1;
    while(numbr <= 10){
        console.log("7 * " + numbr + " = " + 7 * numbr);
        document.write("7 * " + numbr + " = " + 7 * numbr + "<br>");
        numbr++;
    }

    </script>
