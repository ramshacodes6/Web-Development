<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #dbeafe;
        }

        .card{
            width: 320px;
            padding: 30px;
            text-align: center;
            background: white;
            border: 2px solid #2563eb;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);

            transition: 0.4s;
        }

        .card:hover{
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .profile{
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #2563eb;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 35px;
            font-weight: bold;
        }

        h1{
            font-size: 26px;
            margin-bottom: 8px;
            color: #1e293b;
        }

        h3{
            color: #2563eb;
            margin-bottom: 15px;
        }

        p{
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        button{
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;

            transition: 0.3s;
        }

        button:hover{
            background: #1e3a8a;
            transform: scale(1.08);
        }

    </style>
</head>

<body>

    <div class="card">

        <div class="profile">
            R
        </div>

        <h1>Ramsha</h1>

        <h3>Web Developer</h3>

        <p>
            I am learning HTML and CSS
            and building my web development skills.
        </p>

        <button>Contact Me</button>

    </div>

</body>
</html>
