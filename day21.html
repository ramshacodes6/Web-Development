<!DOCTYPE html>
<html>
    <head>
        <title>Box Model</title>
        <style>
            .padded{
                font-size: 20px;
                height: 80px;
                width: 80px;

            }
            #first
            {
               padding-top: 20px;
                padding-right: 50px;
                padding-bottom: 20px;
                padding-left: 50px;
                margin:30px;
                background-color: rgb(178, 237, 226);
                border: 5px solid ;
            }
            #second
            {
                background-color: hotpink;
                margin-top: 30px;
                margin-right: 30px;
                margin-bottom: 30px;
                margin-left: 30px;
                padding:15px;
            }
            #box
            {
                padding: 10px 15px 10px 15px;
                margin-left: 30px;
            }
        </style>
    </head>
    <body>
        <div id="first" class="padded">padding practice</div>
        <div id="second" class="padded">padding practice</div>
        <button id="box">Click Me </button> 
    </body>
</html>
