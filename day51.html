<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pseudo Classes</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            background-color: #e2e8f0;
        }

        .container{

            width: 400px;

            background-color: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1{

            text-align: center;

            margin-bottom: 25px;
        }

        input{

            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 2px solid #cbd5e1;

            border-radius: 8px;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }


        /* Focus */

        input:focus{

            border-color: #2563eb;

            box-shadow: 0 0 10px rgba(37,99,235,0.4);
        }


        button{

            width: 100%;

            padding: 14px;

            background-color: #2563eb;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 17px;

            cursor: pointer;

            transition: 0.3s;
        }


        /* Hover */

        

        /* button:hover{

            background-color: #1d4ed8;

            transform: translateY(-3px);
        } */
        button:hover{
    background-color: green;
    transform: scale(1.05);
}


        /* Active */

        button:active{

            transform: scale(0.95);
        }


        

    </style>

</head>

<body>

    <div class="container">

        <h1>Login</h1>

        <input
            type="text"
            placeholder="Enter your name"
        >

        <input
            type="email"
            placeholder="Enter your email"
        >

        <button>
            Login
        </button>

    </div>

</body>

</html>
