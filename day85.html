<body>

    <h2>Even or Odd</h2>

    <script>
        function checkNumber(num) {

            if (num % 2 === 0) {
                console.log("Even Number");
            } else {
                console.log("Odd Number");
            }

        }

        checkNumber(10);
        checkNumber(7);




// calculate square

function square(number) {
    return number * number;
}

console.log(square(5));
console.log(square(8));
console.log(square(10));
    </script>
