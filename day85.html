<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Functions</title>
</head>
<body>

    <h2>Even or Odd</h2>

    <script>
        function checkNumber(num) {

            if (num % 2 === 0) {
                console.log("Even Number");
            } else {
                console.log("Odd Number");
            }

        }

        checkNumber(10);
        checkNumber(7);

    </script>

</body>
</html>
