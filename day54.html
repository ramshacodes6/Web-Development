<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Linear Gradient</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .box {
            width: 400px;
            height: 200px;

            margin: 50px auto;

            /* background: linear-gradient(
                to right,
                blue,
                purple
            ); */
/*

             to right,

             purple,

             background: linear-gradient(
                to right,
                blue 20%,

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 25px;

            border-radius: 15px;
        }

    </style>

</head>

<body>

    <div class="box">
        Linear Gradient
    </div>

</body>

</html>
