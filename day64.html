<!DOCTYPE html>
<html>
<head>
    <title>Overflow Hidden</title>

    <style>
        .box {
            width: 250px;
            height: 100px;
            border: 2px solid black;
            overflow: scroll;
        }
    </style>
</head>

<body>

    <h2>Overflow Hidden</h2>

    <div class="box">
        This is a very long text. This text is longer than
        the box, so the extra content will be hidden when
        overflow hidden is applied.
    </div>

</body>
</html>
