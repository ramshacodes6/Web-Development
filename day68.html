<!DOCTYPE html>
<html>
<head>
    <title>CSS Cursor</title>

    <style>
        div {
            width: 200px;
            padding: 20px;
            margin: 15px;
            border: 2px solid black;
            text-align: center;
            /* border-radius: 20%; */
        }

        .default {
            cursor: default;
        }

        .pointer {
            cursor: pointer;
        }

        .text {
            cursor: text;
        }

        .not-allowed {
            cursor: not-allowed;
        }

        .crosshair {
            cursor: crosshair;
        }

        .grab {
            cursor: grab;
        }


         button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: blue;
            color: white;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .disabled {
            background-color: gray;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="default">Default</div>
    <div class="pointer">Pointer</div>
    <div class="text">Text</div>
    <div class="not-allowed">Not Allowed</div>
    <div class="crosshair">Crosshair</div>
    <div class="grab">Grab</div>



     <button>Click Me</button>

     <button class="disabled">Disabled</button>

</body>
</html>
