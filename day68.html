<!DOCTYPE html>
<html>
<head>
    <title>CSS Cursor</title>

    <style>
        div {
            width: 200px;
            padding: 20px;
            margin: 15px;
            border: 2px solid black;
            text-align: center;
            /* border-radius: 20%; */
        }

        .default {
            cursor: default;
        }

        .pointer {
            cursor: pointer;
        }

        .text {
            cursor: text;
        }

        .not-allowed {
            cursor: not-allowed;
        }

        .crosshair {
            cursor: crosshair;
        }

        .grab {
            cursor: grab;
        }
    </style>
</head>

<body>

    <div class="default">Default</div>
    <div class="pointer">Pointer</div>
    <div class="text">Text</div>
    <div class="not-allowed">Not Allowed</div>
    <div class="crosshair">Crosshair</div>
    <div class="grab">Grab</div>

</body>
</html>
