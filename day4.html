<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lists</title>
</head>
<body>
			<!--Unordered lists(bulleted)-->
			<h1>My Favourite fruits</h1>
				<ul>
					<li>mango</li>
					<li>grapes</li>
					<li>Apple</li>
				</ul>


				<ul>
   					 <li>Reading</li>
    				<li>Coding</li>
    				<li>Drawing</li>
    				<li>Gaming</li>
				</ul>

				<!--ordered list(numebrs)-->

			<h1>My daily routine</h1>
			<ol>
    			<li>Wake Up</li>
    			<li>Brush Teeth</li>
    			<li>Take Bath</li>
    			<li>Have Breakfast</li>
    			<li>Study</li>
			</ol>


			<!--nested list-->

			<ul>
    			<li>Fruits
        			<ul>
            			<li>Apple</li>
            			<li>Mango</li>
            			<li>Banana</li>
        			</ul>
    			</li>

    			<li>Vegetables
        			<ul>
            			<li>Potato</li>
            			<li>Tomato</li>
            			<li>Onion</li>
        			</ul>
    			</li>
			</ul>

</body>	
</html>
