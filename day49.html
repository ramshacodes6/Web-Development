<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Z-Index Card</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #f1f5f9;
        }

        .card{
            width: 350px;
            height: 250px;

            background-color: white;

            border-radius: 15px;

            position: relative;

            overflow: hidden;

            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .circle{

            width: 180px;
            height: 180px;

            background-color: #2563eb;

            border-radius: 50%;

            position: absolute;

            top: -60px;
            right: -60px;

            z-index: 1;
        }

        .content{

            position: relative;

            z-index: 2;

            padding: 30px;
        }

        .badge{

            position: absolute;

            top: 20px;
            right: 20px;

            background-color: red;

            color: white;

            padding: 8px 15px;

            border-radius: 20px;

            z-index: 3;
        }

        h1{
            margin-top: 50px;
        }

        p{
            margin-top: 15px;
            line-height: 1.5;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="circle"></div>

        <div class="content">

            <h1>Web Developer</h1>

            <p>
                I am learning HTML and CSS
                and improving my skills every day.
            </p>

        </div>

        <div class="badge">
            NEW
        </div>

    </div>

</body>

</html>
